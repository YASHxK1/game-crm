services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamecrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamecrm_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gamecrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamecrm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-run
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gamecrm}:${POSTGRES_PASSWORD:-gamecrm_dev}@db:5432/${POSTGRES_DB:-gamecrm}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-32-chars-minimum-123456}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
